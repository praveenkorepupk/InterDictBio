events {
	worker_connections 1024;
}

http {

  map $http_upgrade $connection_upgrade {
      default upgrade;
      ''      close;
      
    }
    
  server{
  listen 80;
  server_name interdictionary.excelra.co.in; # subdomain name
  return 301 https://interdictionary.excelra.co.in$request_uri;
  }
    
   server {
    listen 443 ssl; # listen port of ssl
    server_name interdictionary.excelra.co.in; # subdomain name 
    
    ssl_certificate /etc/nginx/apache.crt;
    ssl_certificate_key /etc/nginx/apache.key;
    

    location / {
       proxy_pass http://shiny:80/; 
       proxy_set_header X-Real-IP  $remote_addr;
       proxy_set_header X-Forwarded-For $remote_addr;
       proxy_set_header Host $host;
       proxy_set_header X-Forwarded-Proto $scheme;
       proxy_redirect http://shiny:80/ $scheme://$http_host/;
       proxy_http_version 1.1;
       proxy_set_header Upgrade $http_upgrade;
       proxy_set_header Connection $connection_upgrade;
       proxy_read_timeout 20d;
       proxy_buffering off;
       
       }
    }

}
